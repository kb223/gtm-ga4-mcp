name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Protocol-level smoke test: a real MCP client lists tools over stdio.
      # Runs with zero Google credentials — clients are built lazily on first tool call.
      - name: MCP Inspector smoke test (tools/list)
        run: npx --yes @modelcontextprotocol/inspector --cli uv run gtm-ga4-mcp --method tools/list
