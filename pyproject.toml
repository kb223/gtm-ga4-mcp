[project]
name = "gtm-ga4-mcp"
version = "0.1.0"
description = "MCP server for Google Tag Manager + GA4 with tiered safety controls (read / write / destructive)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenneth Buchanan" }]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "google-tag-manager",
    "gtm",
    "ga4",
    "google-analytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=1.12",
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
]

[project.urls]
Homepage = "https://github.com/kb223/gtm-ga4-mcp"
Issues = "https://github.com/kb223/gtm-ga4-mcp/issues"

[project.scripts]
gtm-ga4-mcp = "gtm_ga4_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_ga4_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
